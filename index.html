<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GameHub Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header {
  padding:15px;
  text-align:center;
  background:#020617;
}

#search {
  padding:10px;
  width:60%;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

nav {
  text-align:center;
  padding:10px;
}

button {
  margin:5px;
  padding:10px;
  background:#1e293b;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:hover {
  background:#334155;
}

#games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:20px;
}

.card {
  background:#1e293b;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.08);
  box-shadow:0 0 20px rgba(0,255,255,0.5);
}

.card img {
  width:100%;
  height:120px;
  object-fit:cover;
}

.card h3 {
  padding:10px;
  margin:0;
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

#gameContainer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:scale(0.9); }
  to { opacity:1; transform:scale(1); }
}

.fadeOut {
  animation: fadeOut 0.3s forwards;
}

@keyframes fadeOut {
  to { opacity:0; transform:scale(0.9); }
}
</style>
</head>

<body>

<header>
  <h1>🎮 GameHub Pro</h1>
  <input id="search" placeholder="🔍 Spiel suchen...">
</header>

<nav>
  <button onclick="filterGames('all')">Alle</button>
  <button onclick="filterGames('action')">Action</button>
  <button onclick="filterGames('puzzle')">Puzzle</button>
</nav>

<div id="games"></div>
<div id="player"></div>

<script>

let games = [

{name:"2048", cat:"puzzle", url:"https://www.crazygames.com/embed/2048", img:"https://picsum.photos/300/150?random=1"},
{name:"Slope", cat:"action", url:"https://www.crazygames.com/embed/slope", img:"https://picsum.photos/300/150?random=2"},
{name:"Run 3", cat:"action", url:"https://www.crazygames.com/embed/run-3", img:"https://picsum.photos/300/150?random=3"},
{name:"Drift Hunters", cat:"action", url:"https://www.crazygames.com/embed/drift-hunters", img:"https://picsum.photos/300/150?random=4"},
{name:"Moto X3M", cat:"action", url:"https://www.crazygames.com/embed/moto-x3m", img:"https://picsum.photos/300/150?random=5"},
{name:"Basketball Stars", cat:"action", url:"https://www.crazygames.com/embed/basketball-stars", img:"https://picsum.photos/300/150?random=6"},
{name:"Shell Shockers", cat:"action", url:"https://www.crazygames.com/embed/shellshockers", img:"https://picsum.photos/300/150?random=7"},
{name:"Paper.io", cat:"action", url:"https://www.crazygames.com/embed/paper-io", img:"https://picsum.photos/300/150?random=8"},
{name:"Hole.io", cat:"action", url:"https://www.crazygames.com/embed/hole-io", img:"https://picsum.photos/300/150?random=9"},
{name:"Krunker", cat:"action", url:"https://www.crazygames.com/embed/krunker", img:"https://picsum.photos/300/150?random=10"},
{name:"Chess", cat:"puzzle", url:"https://www.crazygames.com/embed/chess", img:"https://picsum.photos/300/150?random=11"},
{name:"Sudoku", cat:"puzzle", url:"https://www.crazygames.com/embed/sudoku", img:"https://picsum.photos/300/150?random=12"},
{name:"Solitaire", cat:"puzzle", url:"https://www.crazygames.com/embed/solitaire", img:"https://picsum.photos/300/150?random=13"},
{name:"Tic Tac Toe", cat:"puzzle", url:"https://www.crazygames.com/embed/tic-tac-toe", img:"https://picsum.photos/300/150?random=14"},
{name:"Mahjong", cat:"puzzle", url:"https://www.crazygames.com/embed/mahjong", img:"https://picsum.photos/300/150?random=15"},
{name:"Tower Defense", cat:"action", url:"https://www.crazygames.com/embed/tower-defense", img:"https://picsum.photos/300/150?random=16"},
{name:"Stickman Fight", cat:"action", url:"https://www.crazygames.com/embed/stickman-fight", img:"https://picsum.photos/300/150?random=17"},
{name:"Subway Surfers", cat:"action", url:"https://www.crazygames.com/embed/subway-surfers", img:"https://picsum.photos/300/150?random=18"},
{name:"Temple Run", cat:"action", url:"https://www.crazygames.com/embed/temple-run", img:"https://picsum.photos/300/150?random=19"},
{name:"Idle Miner", cat:"puzzle", url:"https://www.crazygames.com/embed/idle-miner", img:"https://picsum.photos/300/150?random=20"}

];

// anzeigen
function renderGames(list){
  let g = document.getElementById("games");
  g.innerHTML = "";

  list.forEach(game=>{
    g.innerHTML += `
      <div class="card" onclick="play('${game.url}')">
        <img src="${game.img}">
        <h3>${game.name}</h3>
      </div>
    `;
  });
}

// starten
function play(url){
  document.getElementById("player").innerHTML = `
    <div id="gameContainer">
      <button onclick="closeGame()" style="
        position:absolute;
        top:15px;
        right:15px;
        z-index:1000;
        padding:10px;
        background:red;
        color:white;
        border:none;
        border-radius:10px;
      ">❌</button>
      <iframe src="${url}"></iframe>
    </div>
  `;
}

// schließen
function closeGame(){
  let game = document.getElementById("gameContainer");
  game.classList.add("fadeOut");

  setTimeout(()=>{
    document.getElementById("player").innerHTML = "";
  }, 300);
}

// filter
function filterGames(cat){
  if(cat === "all") renderGames(games);
  else renderGames(games.filter(g=>g.cat === cat));
}

// suche
document.getElementById("search").addEventListener("input", e=>{
  let val = e.target.value.toLowerCase();
  renderGames(games.filter(g=>g.name.toLowerCase().includes(val)));
});

// start
renderGames(games);

</script>

</body>
</html>
