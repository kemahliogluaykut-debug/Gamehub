<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GameHub Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header {
  padding:15px;
  text-align:center;
  background:#020617;
}

#search {
  padding:10px;
  width:60%;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

nav {
  text-align:center;
  padding:10px;
}

button {
  margin:5px;
  padding:10px;
  background:#1e293b;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:hover {
  background:#334155;
}

#games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:20px;
}

.card {
  background:#1e293b;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 0 transparent;
}

.card:hover {
  transform:scale(1.08);
  box-shadow:0 0 20px rgba(0,255,255,0.5);
}

.card img {
  width:100%;
  height:120px;
  object-fit:cover;
}

.card h3 {
  padding:10px;
  margin:0;
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

#gameContainer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:999;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:scale(0.9); }
  to { opacity:1; transform:scale(1); }
}

.fadeOut {
  animation: fadeOut 0.3s forwards;
}

@keyframes fadeOut {
  to { opacity:0; transform:scale(0.9); }
}
</style>
</head>

<body>

<header>
  <h1>🎮 GameHub Pro</h1>
  <input id="search" placeholder="🔍 Spiel suchen...">
</header>

<nav>
  <button onclick="filterGames('all')">Alle</button>
  <button onclick="filterGames('action')">Action</button>
  <button onclick="filterGames('puzzle')">Puzzle</button>
</nav>

<div id="games"></div>
<div id="player"></div>

<script>

// SPIELE MIT BILDERN
let games = [
  {
    name:"2048",
    cat:"puzzle",
    url:"https://www.crazygames.com/embed/2048",
    img:"https://via.placeholder.com/300x150?text=2048"
  },
  {
    name:"Snake",
    cat:"action",
    url:"https://playsnake.org/",
    img:"https://via.placeholder.com/300x150?text=Snake"
  },
  {
    name:"Slope",
    cat:"action",
    url:"https://www.crazygames.com/embed/slope",
    img:"https://via.placeholder.com/300x150?text=Slope"
  },
  {
    name:"Run 3",
    cat:"action",
    url:"https://www.crazygames.com/embed/run-3",
    img:"https://via.placeholder.com/300x150?text=Run+3"
  }
];

// RENDER
function renderGames(list){
  let g = document.getElementById("games");
  g.innerHTML = "";

  list.forEach(game=>{
    g.innerHTML += `
      <div class="card" onclick="play('${game.url}')">
        <img src="${game.img}">
        <h3>${game.name}</h3>
      </div>
    `;
  });
}

// SPIEL START
function play(url){
  document.getElementById("player").innerHTML = `
    <div id="gameContainer">
      <button onclick="closeGame()" style="
        position:absolute;
        top:15px;
        right:15px;
        z-index:1000;
        padding:10px;
        background:red;
        color:white;
        border:none;
        border-radius:10px;
      ">❌</button>

      <iframe src="${url}"></iframe>
    </div>
  `;
}

// SCHLIESSEN
function closeGame(){
  let game = document.getElementById("gameContainer");
  game.classList.add("fadeOut");

  setTimeout(()=>{
    document.getElementById("player").innerHTML = "";
  }, 300);
}

// FILTER
function filterGames(cat){
  if(cat === "all") renderGames(games);
  else renderGames(games.filter(g=>g.cat === cat));
}

// SUCHE
document.getElementById("search").addEventListener("input", e=>{
  let val = e.target.value.toLowerCase();
  renderGames(games.filter(g=>g.name.toLowerCase().includes(val)));
});

renderGames(games);

</script>

</body>
</html>
